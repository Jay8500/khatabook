name: Supabase

# Pushes migrations and deploys edge functions when supabase/ changes on main.
# Needs repo secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD.
on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Skip until Supabase secrets are set
        if: env.PROJECT_REF == ''
        run: echo "SUPABASE_PROJECT_REF not set; skipping."
      - uses: actions/checkout@v5
        if: env.PROJECT_REF != ''
      - uses: supabase/setup-cli@v1
        if: env.PROJECT_REF != ''
        with:
          version: latest
      - name: Link project
        if: env.PROJECT_REF != ''
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Push migrations
        if: env.PROJECT_REF != ''
        run: supabase db push
      - name: Deploy edge functions
        if: env.PROJECT_REF != ''
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api
